name: CI

on:
  pull_request:

jobs:
  build:
    name: Build (release)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Build release
        run: swift build -c release

  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run tests
        run: swift test

  test-tsan:
    name: Test (thread sanitizer)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run tests with thread sanitizer
        run: swift test --sanitize=thread
